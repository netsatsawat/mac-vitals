name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Self-test (bounded readings, no Xcode needed)
        run: .build/release/vitals --selftest

      - name: MCP server integration test
        run: python3 scripts/test-mcp.py .build/release/vitals

      - name: Unit tests
        run: swift test

      - name: Assemble app bundle
        run: ./scripts/build-app.sh release
