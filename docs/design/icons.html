<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mac Vitals icon concepts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e9e9ee; font-family: -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif; padding: 40px; }
  .sheet { display: grid; grid-template-columns: repeat(4, 1fr); gap: 34px; max-width: 1160px; margin: 0 auto; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  /* macOS Big Sur squircle: continuous rounded rect, subtle depth. */
  .icon {
    width: 232px; height: 232px; border-radius: 52px; position: relative; overflow: hidden;
    box-shadow: 0 12px 26px -8px rgba(20,16,40,.45), inset 0 1.5px 0 rgba(255,255,255,.12);
  }
  .icon svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .label { font-size: 15px; font-weight: 600; color: #3a3a42; }
  .label b { color: #16161a; }
  h1 { text-align: center; font-size: 18px; color: #3a3a42; margin-bottom: 30px; font-weight: 600; }
</style>
</head>
<body>
<h1>Mac Vitals — icon concepts</h1>
<div class="sheet" id="sheet"></div>
<script>
const bgGraphite = `<defs>
  <radialGradient id="bgg" cx="30%" cy="22%" r="120%">
    <stop offset="0" stop-color="#33333b"/><stop offset="55%" stop-color="#202027"/><stop offset="100%" stop-color="#131317"/>
  </radialGradient></defs>
  <rect width="100" height="100" fill="url(#bgg)"/>`;
const bgInk = `<defs>
  <radialGradient id="bgi" cx="32%" cy="20%" r="120%">
    <stop offset="0" stop-color="#25252b"/><stop offset="60%" stop-color="#141418"/><stop offset="100%" stop-color="#0a0a0d"/>
  </radialGradient></defs>
  <rect width="100" height="100" fill="url(#bgi)"/>`;
const bgPurple = `<defs>
  <radialGradient id="bgp" cx="28%" cy="18%" r="125%">
    <stop offset="0" stop-color="#3d2e72"/><stop offset="55%" stop-color="#241c4a"/><stop offset="100%" stop-color="#12102a"/>
  </radialGradient></defs>
  <rect width="100" height="100" fill="url(#bgp)"/>`;

// arc path helper on a 100x100 canvas
function arc(cx, cy, r, a0, a1) {
  const p0 = [cx + r*Math.cos(a0*Math.PI/180), cy + r*Math.sin(a0*Math.PI/180)];
  const p1 = [cx + r*Math.cos(a1*Math.PI/180), cy + r*Math.sin(a1*Math.PI/180)];
  const large = (a1 - a0) % 360 > 180 ? 1 : 0;
  return `M ${p0[0].toFixed(2)} ${p0[1].toFixed(2)} A ${r} ${r} 0 ${large} 1 ${p1[0].toFixed(2)} ${p1[1].toFixed(2)}`;
}

// A — single gauge (speedometer, 270deg, multicolour sweep)
const gauge = `<svg viewBox="0 0 100 100">${bgGraphite}
  <defs><linearGradient id="ga" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#34c759"/><stop offset="0.55" stop-color="#ffcc00"/><stop offset="1" stop-color="#ff3b30"/>
  </linearGradient></defs>
  <path d="${arc(50,50,27,135,405)}" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="11" stroke-linecap="round"/>
  <path d="${arc(50,50,27,135,338)}" fill="none" stroke="url(#ga)" stroke-width="11" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="5.5" fill="#f5f5f7"/>
</svg>`;

// B — pulse / EKG (Activity-Monitor-adjacent, health metaphor)
const pulse = `<svg viewBox="0 0 100 100">${bgInk}
  <defs><filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <path d="M 20 52 L 34 52 L 40 34 L 48 66 L 55 44 L 61 52 L 80 52" fill="none"
    stroke="#34c759" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>`;

// C — chip with a pulse through it
const chip = `<svg viewBox="0 0 100 100">${bgGraphite}
  <g stroke="#0a84ff" stroke-width="5" stroke-linecap="round" fill="none">
    <rect x="32" y="32" width="36" height="36" rx="9"/>
    <path d="M40 32 V24 M50 32 V24 M60 32 V24 M40 68 V76 M50 68 V76 M60 68 V76 M32 40 H24 M32 50 H24 M32 60 H24 M68 40 H76 M68 50 H76 M68 60 H76"/>
  </g>
  <path d="M38 52 L45 52 L49 44 L54 60 L58 52 L62 52" fill="none" stroke="#34c759" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

// D — triad of rings (CPU / GPU / memory identity)
const triad = `<svg viewBox="0 0 100 100">${bgPurple}
  <path d="${arc(50,50,30,140,410)}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="${arc(50,50,30,140,320)}" fill="none" stroke="#34c759" stroke-width="6.5" stroke-linecap="round"/>
  <path d="${arc(50,50,21,140,410)}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="${arc(50,50,21,140,300)}" fill="none" stroke="#ffcc00" stroke-width="6.5" stroke-linecap="round"/>
  <path d="${arc(50,50,12,140,410)}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="${arc(50,50,12,140,300)}" fill="none" stroke="#0a84ff" stroke-width="6.5" stroke-linecap="round"/>
</svg>`;

const concepts = [
  ["A", "Gauge", gauge],
  ["B", "Pulse", pulse],
  ["C", "Chip", chip],
  ["D", "Triad", triad],
];
document.getElementById("sheet").innerHTML = concepts.map(([k, name, svg]) =>
  `<div class="cell"><div class="icon">${svg}</div><div class="label"><b>${k}</b> · ${name}</div></div>`
).join("");
</script>
</body>
</html>
