<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mac Vitals hero</title>
<style>
  :root {
    font-family: -apple-system, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    --num: "SF Mono", ui-monospace, "SF Pro Text", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0c0a12; color: #111; -webkit-font-smoothing: antialiased; }

  .board { display: grid; grid-template-columns: 1fr; gap: 0; min-height: 100vh; background: #0c0a12; }
  .scene {
    position: relative; height: 660px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  /* Desktop wallpaper stand-ins so the vibrancy material has something to blur. */
  .scene.dark  { background:
      radial-gradient(125% 95% at 14% 6%, #3d2e72 0%, #241c4a 40%, #141127 74%, #0c0a1a 100%); }
  .scene.light { background:
      radial-gradient(125% 100% at 84% 4%, #ffe0b0 0%, #f5a98d 32%, #de85ad 64%, #9a71cf 100%); }

  .scene-tag {
    position: absolute; left: 18px; bottom: 14px; z-index: 20;
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 600; padding: 5px 10px; border-radius: 7px;
    background: rgba(0,0,0,.28); color: rgba(255,255,255,.9); backdrop-filter: blur(8px);
  }

  /* ---- macOS menu bar ---- */
  .menubar {
    position: relative; z-index: 10; height: 26px; flex: none;
    display: flex; align-items: center; gap: 15px;
    padding: 0 12px 0 14px; font-size: 13px; font-weight: 500;
    backdrop-filter: blur(24px) saturate(1.6);
  }
  .dark  .menubar { background: rgba(28,28,32,.55); color: #f5f5f7; box-shadow: inset 0 -.5px 0 rgba(255,255,255,.10); }
  .light .menubar { background: rgba(250,250,252,.62); color: #1d1d1f; box-shadow: inset 0 -.5px 0 rgba(0,0,0,.10); }
  .menubar .apple { font-size: 15px; margin-right: 2px; }
  .menubar .spacer { flex: 1; }
  .menubar .extra { display: flex; align-items: center; gap: 8px; opacity: .92; }
  .menubar .extra svg { display: block; }
  .menubar .clock { font-variant-numeric: tabular-nums; }

  .vit-item {
    display: flex; align-items: center; gap: 9px;
    padding: 3px 8px; border-radius: 6px; font-variant-numeric: tabular-nums;
  }
  .vit-item.active { background: rgba(120,120,140,.22); }
  .vit-metric { display: flex; align-items: center; gap: 4px; font-weight: 600; }
  .vit-metric svg { width: 13px; height: 13px; opacity: .8; }
  .vit-metric .val { font-family: var(--num); font-size: 12.5px; letter-spacing: -.02em; }

  /* ---- stage: responsive, wraps instead of overlapping ---- */
  .stage {
    flex: 1; display: flex; flex-wrap: wrap; gap: 30px;
    justify-content: center; align-items: center;
    padding: 0 40px;
  }

  .surface {
    border-radius: 20px; padding: 16px 16px 14px;
    backdrop-filter: blur(34px) saturate(1.7);
  }
  .dark  .surface { background: rgba(32,32,36,.62); box-shadow:
      0 24px 50px -16px rgba(0,0,0,.62), 0 4px 14px -4px rgba(0,0,0,.4),
      inset 0 .5px 0 rgba(255,255,255,.14), inset 0 0 0 .5px rgba(255,255,255,.06); }
  .light .surface { background: rgba(252,252,254,.70); box-shadow:
      0 24px 50px -16px rgba(80,60,90,.34), 0 3px 12px -4px rgba(80,60,90,.22),
      inset 0 .5px 0 rgba(255,255,255,.7), inset 0 0 0 .5px rgba(0,0,0,.05); }

  .dark  { --ink: #f5f5f7; --ink2: rgba(235,235,245,.62); --ink3: rgba(235,235,245,.40);
           --track: rgba(255,255,255,.11); --hair: rgba(255,255,255,.09); --blue: #0a84ff; }
  .light { --ink: #1d1d1f; --ink2: rgba(60,60,67,.62); --ink3: rgba(60,60,67,.40);
           --track: rgba(0,0,0,.09); --hair: rgba(0,0,0,.07); --blue: #007aff; }

  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .head .mark { width: 18px; height: 18px; color: var(--ink); opacity: .9; }
  .head h1 { font-size: 13px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); }
  .head .live { margin-left: auto; display: flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink3); }
  .head .live i { width: 6px; height: 6px; border-radius: 50%; background: #34c759;
    box-shadow: 0 0 0 3px rgba(52,199,89,.18); }

  /* ---- floating widget ---- */
  .widget { width: 300px; }
  .rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .gauge { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .ring { position: relative; width: 78px; height: 78px; }
  .ring svg { transform: rotate(-90deg); display: block; }
  .ring .cap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .ring .cap .pct { font-family: var(--num); font-size: 18px; font-weight: 600;
    letter-spacing: -.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .ring .cap .pct u { font-size: 10px; font-weight: 600; opacity: .5; text-decoration: none; }
  .gauge .lbl { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--ink2); }
  .gauge .lbl svg { width: 13px; height: 13px; }
  .gauge .sub { font-family: var(--num); font-size: 10px; color: var(--ink3);
    font-variant-numeric: tabular-nums; margin-top: -3px; white-space: nowrap; }

  .foot { margin-top: 14px; padding-top: 13px; border-top: .5px solid var(--hair);
    display: flex; flex-direction: column; gap: 13px; }
  .pwr { display: flex; align-items: center; gap: 9px; }
  .pwr .mark { width: 16px; height: 16px; color: var(--ink); opacity: .72; flex: none; }
  .pwr .w { font-family: var(--num); font-size: 22px; font-weight: 600; letter-spacing: -.03em;
    color: var(--ink); font-variant-numeric: tabular-nums; }
  .pwr .w u { font-size: 12px; opacity: .5; text-decoration: none; font-weight: 600; margin-left: 1px; }
  .pwr .split { margin-left: auto; display: flex; gap: 12px; }
  .pwr .split span { font-size: 11px; color: var(--ink2); }
  .pwr .split b { font-family: var(--num); color: var(--ink); font-weight: 600; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .cores .row { display: flex; align-items: center; gap: 10px; }
  .cores .k { font-size: 10.5px; font-weight: 600; color: var(--ink2); flex: none; }
  .cores .bars { display: flex; gap: 3px; flex: 1; height: 18px; align-items: flex-end; }
  .cores .bars i { flex: 1; height: 100%; border-radius: 3px; background: var(--track);
    position: relative; overflow: hidden; }
  .cores .bars i b { position: absolute; left: 0; bottom: 0; width: 100%; border-radius: 3px; }

  /* ---- popover ---- */
  .popover { width: 266px; position: relative; }
  .popover .tail { position: absolute; top: -7px; right: 44px; width: 16px; height: 8px; overflow: hidden; }
  .popover .tail::after { content: ""; position: absolute; left: 2px; top: 4px; width: 12px; height: 12px;
    transform: rotate(45deg); border-radius: 3px; }
  .dark  .popover .tail::after { background: rgba(48,48,54,.86); }
  .light .popover .tail::after { background: rgba(252,252,254,.9); }

  .plist { display: flex; flex-direction: column; }
  .prow { display: flex; align-items: center; gap: 11px; padding: 10px 2px; }
  .prow + .prow { border-top: .5px solid var(--hair); }
  .prow .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; }
  .prow .ic svg { width: 15px; height: 15px; }
  .prow .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .prow .trow { display: flex; align-items: baseline; gap: 6px; }
  .prow .trow .name { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .prow .trow .val { margin-left: auto; font-family: var(--num); font-size: 13px; font-weight: 600;
    color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .prow .trow .val u { font-size: 9.5px; opacity: .5; text-decoration: none; margin-left: .5px; }
  .prow .bar { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .prow .bar b { display: block; height: 100%; border-radius: 2px; }
  .prow .sub { font-family: var(--num); font-size: 10px; color: var(--ink3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .prow .spark { width: 50px; height: 24px; flex: none; }

  .pfoot { display: flex; align-items: center; gap: 8px; padding-top: 12px; margin-top: 4px; border-top: .5px solid var(--hair); }
  .pfoot .pill { font-size: 10.5px; font-weight: 600; color: var(--ink2); display: flex; align-items: center; gap: 5px; }
  .pfoot .pill i { width: 7px; height: 7px; border-radius: 50%; }
  .pfoot .btn { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--ink2); font-variant-numeric: tabular-nums; }

  .caption { grid-column: 1 / -1; background: #17171a; color: #a1a1aa; font-size: 12px;
    padding: 12px 18px; display: flex; flex-wrap: wrap; gap: 10px 24px; font-weight: 500; }
  .caption b { color: #ececf0; font-weight: 600; }
</style>
</head>
<body>
<div class="board">
  <section class="scene dark">
    <div class="menubar">
      <span class="apple"></span>
      <span style="font-weight:600">Mac Vitals</span><span>View</span><span>Window</span><span>Help</span>
      <span class="spacer"></span>
      <div class="vit-item active" id="mb-dark"></div>
      <span class="extra" id="ext-dark"></span>
      <span class="clock">Mon 9:41 AM</span>
    </div>
    <div class="stage">
      <div class="surface widget" id="wid-dark"></div>
      <div class="surface popover" id="pop-dark"></div>
    </div>
    
  </section>

  

  </div>

<script>
const data = {
  cpu: { usage: 42, e: 18, p: 66, cores: [22,14,9,7,4,3, 71,64,68,61], eCount: 6 },
  gpu: { usage: 71, provisional: false },
  mem: { usedGB: 14.2, totalGB: 24, pct: 59 },
  pwr: { total: 21.1, cpu: 11.3, gpu: 9.8 },
  net: { down: '2.4 MB/s', up: '480 KB/s' },
  disk: { free: '1542', read: '0 B/s', write: '1.1 MB/s' },
  bat: { pct: 100 },
  thermal: { temp: 46, fan: 1850 },
  hist: {
    cpu: [30,34,31,38,52,49,44,58,63,55,47,42,45,40,44,52,60,57,49,42],
    gpu: [8,10,22,40,55,62,70,74,69,72,80,77,66,71,73,68,72,71,70,71],
    mem: [54,55,55,56,57,57,58,58,58,59,59,59,59,59,59,59,59,59,59,59]
  }
};

function loadColor(p){
  const stops = [[0,[52,199,89]],[55,[52,199,89]],[70,[255,204,0]],[85,[255,149,0]],[100,[255,59,48]]];
  for(let i=0;i<stops.length-1;i++){
    const [a,ca]=stops[i], [b,cb]=stops[i+1];
    if(p<=b){ const t=(p-a)/(b-a||1); const c=ca.map((v,k)=>Math.round(v+(cb[k]-v)*t)); return `rgb(${c[0]},${c[1]},${c[2]})`; }
  }
  return 'rgb(255,59,48)';
}

function ring(pct, color, size=78, sw=8){
  const r=(size-sw)/2, C=2*Math.PI*r, dash=Math.max(0,Math.min(100,pct))/100*C;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-linecap="round" stroke-dasharray="${dash} ${C-dash}"/></svg>`;
}
function spark(series, color, w=50, h=24){
  const min=Math.min(...series), max=Math.max(...series), rng=(max-min)||1;
  const pts=series.map((v,i)=>[ (i/(series.length-1))*w, h-2 - ((v-min)/rng)*(h-4) ]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${w} ${h} L 0 ${h} Z`;
  const id='g'+Math.random().toString(36).slice(2,7);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".30"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2" fill="${color}"/></svg>`;
}
const I = {
  gauge:`<svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="gmgrad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#34c759"/><stop offset=".55" stop-color="#ffcc00"/><stop offset="1" stop-color="#ff3b30"/></linearGradient></defs><g transform="rotate(135 12 12)"><circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-opacity="0.16" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="35.3 11.8"/><circle cx="12" cy="12" r="7.5" stroke="url(#gmgrad)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="26.4 20.7"/></g><circle cx="12" cy="12" r="1.7" fill="currentColor"/></svg>`,
  cpu:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2.4"/><path d="M10 2v3M14 2v3M10 19v3M14 19v3M2 10h3M2 14h3M19 10h3M19 14h3"/></svg>`,
  gpu:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.6"/><circle cx="9" cy="12" r="2.6"/><path d="M15 10.5h4M15 13.5h4"/></svg>`,
  mem:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="9" rx="1.8"/><path d="M6.5 8V5.5M11 8V5.5M15.5 8V5.5M7 12v2M12 12v2M17 12v2"/></svg>`,
  bolt:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>`,
  net:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.7 3.8 9S14.5 18.5 12 21c-2.5-2.5-3.8-5.7-3.8-9S9.5 5.5 12 3Z"/></svg>`,
  disk:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.4"/><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/></svg>`,
  thermo:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0Z"/></svg>`,
  wifi:`<svg width="16" height="13" viewBox="0 0 24 20" fill="currentColor"><path d="M12 3C7.5 3 3.7 4.8 1 7.6l2 2C5.3 7.3 8.5 6 12 6s6.7 1.3 9 3.6l2-2C20.3 4.8 16.5 3 12 3Zm0 5c-2.8 0-5.3 1.1-7 3l2 2c1.3-1.3 3-2 5-2s3.7.7 5 2l2-2c-1.7-1.9-4.2-3-7-3Zm0 5c-1.1 0-2.1.5-2.8 1.2L12 17l2.8-2.8C14.1 13.5 13.1 13 12 13Z"/></svg>`,
  batt:`<svg width="26" height="13" viewBox="0 0 30 14" fill="none"><rect x="1" y="2" width="24" height="10" rx="2.6" stroke="currentColor" stroke-opacity=".5" stroke-width="1.2"/><rect x="3" y="4" width="16" height="6" rx="1.2" fill="currentColor"/><rect x="26.5" y="5" width="2" height="4" rx="1" fill="currentColor" fill-opacity=".5"/></svg>`,
  down:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>`,
  up:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`
};
function pctHTML(v){ return `${Math.round(v)}<u>%</u>`; }
function chip(color){ if(String(color).startsWith('var')) return 'rgba(10,132,255,.15)'; const m=color.match(/\d+/g); return `rgba(${m[0]},${m[1]},${m[2]},.16)`; }

function widget(d){
  const cpuC=loadColor(d.cpu.usage), gpuC=loadColor(d.gpu.usage);
  const bars = d.cpu.cores.map(v=>`<i><b style="height:${Math.max(8,v)}%;background:${loadColor(v)}"></b></i>`).join('');
  return `
  <div class="head"><span class="mark">${I.gauge}</span><h1>Mac Vitals</h1><span class="live"><i></i>Live</span></div>
  <div class="rings">
    <div class="gauge"><div class="ring">${ring(d.cpu.usage,cpuC)}<div class="cap"><span class="pct">${pctHTML(d.cpu.usage)}</span></div></div>
      <div class="lbl">${I.cpu} CPU</div><div class="sub">E ${d.cpu.e} · P ${d.cpu.p}</div></div>
    <div class="gauge"><div class="ring">${ring(d.gpu.usage,gpuC)}<div class="cap"><span class="pct">${pctHTML(d.gpu.usage)}</span></div></div>
      <div class="lbl">${I.gpu} GPU</div><div class="sub">${d.gpu.provisional?'provisional':'&nbsp;'}</div></div>
    <div class="gauge"><div class="ring">${ring(d.mem.pct,'var(--blue)')}<div class="cap"><span class="pct">${pctHTML(d.mem.pct)}</span></div></div>
      <div class="lbl">${I.mem} Memory</div><div class="sub">${d.mem.usedGB} / ${d.mem.totalGB} GB</div></div>
  </div>
  <div class="foot">
    <div class="pwr"><span class="mark">${I.bolt}</span><span class="w">${d.pwr.total.toFixed(1)}<u>W</u></span>
      <span class="split"><span>CPU<b>${d.pwr.cpu.toFixed(1)}</b></span><span>GPU<b>${d.pwr.gpu.toFixed(1)}</b></span></span></div>
    <div class="cores"><div class="row"><span class="k">Cores</span><div class="bars">${bars}</div></div></div>
  </div>`;
}

function prow(o){
  return `<div class="prow">
    <div class="ic" style="background:${chip(o.tint)};color:${o.tint}">${o.ic}</div>
    <div class="meta">
      <div class="trow"><span class="name">${o.name}</span><span class="val">${o.val}</span></div>
      ${o.bar!=null?`<div class="bar"><b style="width:${o.bar}%;background:${o.tint}"></b></div>`:''}
      ${o.sub?`<div class="sub">${o.sub}</div>`:''}
    </div>
    ${o.s?`<div class="spark">${spark(o.s,o.tint)}</div>`:''}
  </div>`;
}
function popover(d){
  const rows = [
    prow({name:'CPU', ic:I.cpu, tint:loadColor(d.cpu.usage), val:pctHTML(d.cpu.usage), bar:d.cpu.usage, sub:`E ${d.cpu.e} · P ${d.cpu.p}`, s:d.hist.cpu}),
    prow({name:'GPU', ic:I.gpu, tint:loadColor(d.gpu.usage), val:pctHTML(d.gpu.usage), bar:d.gpu.usage, sub:d.gpu.provisional?'provisional':'', s:d.hist.gpu}),
    prow({name:'Memory', ic:I.mem, tint:'var(--blue)', val:pctHTML(d.mem.pct), bar:d.mem.pct, sub:`${d.mem.usedGB} / ${d.mem.totalGB} GB`, s:d.hist.mem}),
    prow({name:'Power', ic:I.bolt, tint:'#ff9f0a', val:`${d.pwr.total.toFixed(1)}<u>W</u>`, bar:null, sub:`CPU ${d.pwr.cpu.toFixed(1)} · GPU ${d.pwr.gpu.toFixed(1)}`, s:null}),
    prow({name:'Network', ic:I.net, tint:'var(--blue)', val:`↓ ${d.net.down}`, bar:null, sub:`↑ ${d.net.up}`, s:null}),
    prow({name:'Disk', ic:I.disk, tint:'#5ac8fa', val:`${d.disk.free} GB`, bar:null, sub:`R ${d.disk.read} · W ${d.disk.write}`, s:null}),
    prow({name:'Battery', ic:I.batt, tint:'#34c759', val:pctHTML(d.bat.pct), bar:d.bat.pct, sub:'on battery', s:null}),
    prow({name:'Temperature', ic:I.thermo, tint:loadColor(d.thermal.temp), val:`${d.thermal.temp}<u>°C</u>`, bar:null, sub:`fan ${d.thermal.fan} rpm`, s:null}),
  ].join('');
  return `<span class="tail"></span>
    <div class="head"><span class="mark">${I.gauge}</span><h1>Mac Vitals</h1><span class="live"><i></i>Live</span></div>
    <div class="plist">${rows}</div>
    <div class="pfoot"><span class="pill"><i style="background:#34c759"></i>Pressure normal</span><span class="btn">Show widget ⌥⌘V</span></div>`;
}
function rateCompact(s){
  const m = String(s).match(/([\d.]+)\s*(MB|KB|GB|B)/);
  if(!m) return '0';
  const v = parseFloat(m[1]);
  if(m[2]==='GB') return Math.round(v*1024)+'M';
  if(m[2]==='MB') return Math.round(v)+'M';
  if(m[2]==='KB') return Math.round(v)+'K';
  return '0';
}
function menubarItem(d){
  const m=(ic,v)=>`<span class="vit-metric">${ic}<span class="val">${v}</span></span>`;
  return m(I.cpu, d.cpu.usage+'%') + m(I.gpu, d.gpu.usage+'%') + m(I.mem, d.mem.pct+'%')
       + m(I.down, rateCompact(d.net.down)) + m(I.up, rateCompact(d.net.up));
}

for(const mode of ['dark']){
  document.getElementById('wid-'+mode).innerHTML = widget(data);
  document.getElementById('pop-'+mode).innerHTML = popover(data);
  document.getElementById('mb-'+mode).innerHTML = menubarItem(data);
  document.getElementById('ext-'+mode).innerHTML = I.wifi + I.batt;
}
</script>
